      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('progress');
      const notice = document.getElementById('notice');
      const retry = document.getElementById('retry');
      let failed = false;
      retry.addEventListener('click', () => window.location.reload());
      const fail = (error) => {
        if (failed) return;
        failed = true;
        status.textContent = 'The village could not finish loading.';
        notice.hidden = false;

        const engine = new Engine(config);
        engine.startGame({ onProgress(current, total) {
          if (failed) return;
          if (total > 0) {
            progress.max = total;
            progress.value = current;
            const percent = Math.max(0, Math.min(100, Math.round(current * 100 / total)));
            status.textContent = `Preparing the village… ${percent}%`;
          } else {
            progress.removeAttribute('value');
            status.textContent = 'Preparing the village…';
          }
        }}).then(() => {
